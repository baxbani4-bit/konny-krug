name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Запустить сервер синхронизации
        run: |
          cd server && DATA_FILE=/tmp/data.json PORT=8089 node server.js &
          sleep 2
          curl -sf http://127.0.0.1:8089/api/health

      - name: Тесты логики, интерфейса и синхронизации
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Сборка APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Выложить APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: konny-krug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Отчёт о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7
